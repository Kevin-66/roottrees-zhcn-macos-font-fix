; The Roottrees are Dead - Simplified Chinese font fix for macOS
; https://github.com/Kevin-66/roottrees-zhcn-macos-font-fix
;
; Some labels (e.g. the "for dunces" page on the corkboard) don't set a font and
; fall through to Godot's built-in Open Sans, which has no Chinese glyphs. On macOS
; Godot's system-font fallback fails, so the text renders as hex-code boxes.
; This makes the engine's default font the game's own bundled Source Han Sans SC.
; Delete this file to undo.
[gui]

theme/custom_font="res://fonts/SourceHanSansSC-Normal.otf"
